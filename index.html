<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="INK Tattoo Studio - Complete Website Package with Multiple Themes">
    <title>INK Tattoo Studio - Package Overview</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="bg-white border-b border-gray-300 py-6">
            <div class="container mx-auto px-4 max-w-6xl">
                <div class="text-center">
                    <h1 class="text-3xl font-bold text-black mb-2" v-text="t('title')">INKTATTOO</h1>
                    <p class="text-gray-600" v-text="t('subtitle')">Complete Website Package</p>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main class="container mx-auto px-4 max-w-6xl py-12">
            
            <!-- Introduction -->
            <section class="mb-8 md:mb-12 text-center px-4">
                <h2 class="text-2xl md:text-3xl font-bold text-black mb-4" v-text="t('welcome-title')"></h2>
                <p class="text-base md:text-lg text-gray-700 max-w-3xl mx-auto mb-6" v-text="t('welcome-desc')">
                </p>
            </section>
            
            <!-- Templates -->
            <section class="mb-8 md:mb-12 px-4">
                <h2 class="text-xl md:text-2xl font-bold text-black mb-4 md:mb-6 text-center" v-text="t('templates')"></h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                    <a href="template-4.html" class="block bg-white border border-gray-300 rounded p-4 md:p-6 hover:border-black transition">
                        <div class="bg-black rounded mb-3 md:mb-4 h-28 md:h-32 overflow-hidden">
                            <img src="https://images.pexels.com/photos/28991534/pexels-photo-28991534.jpeg?auto=compress&cs=tinysrgb&w=600&h=300&fit=crop" 
                                 alt="Dark Mode" 
                                 class="w-full h-full object-cover">
                        </div>
                        <h3 class="text-base md:text-lg font-bold text-black text-center mb-1">Dark Mode</h3>
                        <p class="text-xs text-gray-500 text-center">Frontend</p>
                    </a>
                    
                    <a href="template-5.html" class="block bg-white border border-gray-300 rounded p-4 md:p-6 hover:border-black transition">
                        <div class="bg-white rounded mb-3 md:mb-4 h-28 md:h-32 overflow-hidden border border-gray-300">
                            <img src="https://images.pexels.com/photos/28991534/pexels-photo-28991534.jpeg?auto=compress&cs=tinysrgb&w=600&h=300&fit=crop" 
                                 alt="White Black" 
                                 class="w-full h-full object-cover filter grayscale">
                        </div>
                        <h3 class="text-base md:text-lg font-bold text-black text-center mb-1">White Black</h3>
                        <p class="text-xs text-gray-500 text-center">Frontend</p>
                    </a>
                    
                    <a href="template-7.html" class="block bg-white border border-gray-300 rounded p-4 md:p-6 hover:border-black transition">
                        <div class="bg-white rounded mb-3 md:mb-4 h-28 md:h-32 overflow-hidden flex items-center justify-center border border-gray-300">
                            <div class="text-center p-4">
                                <i class="fas fa-chart-line text-3xl text-black mb-2"></i>
                                <div class="grid grid-cols-2 gap-2">
                                    <div class="bg-black h-6 rounded"></div>
                                    <div class="bg-gray-300 h-6 rounded"></div>
                                    <div class="bg-gray-300 h-6 rounded"></div>
                                    <div class="bg-black h-6 rounded"></div>
                                </div>
                            </div>
                        </div>
                        <h3 class="text-base md:text-lg font-bold text-black text-center mb-1">Dashboard Admin</h3>
                        <p class="text-xs text-gray-500 text-center">Backend</p>
                    </a>
                    
                    <a href="template-8.html" class="block bg-white border border-gray-300 rounded p-4 md:p-6 hover:border-black transition">
                        <div class="bg-white rounded mb-3 md:mb-4 h-28 md:h-32 overflow-hidden flex items-center justify-center border border-gray-300">
                            <div class="text-center p-4">
                                <i class="fas fa-file-alt text-3xl text-black mb-2"></i>
                                <div class="mt-2">
                                    <div class="bg-black h-5 rounded mb-1"></div>
                                    <div class="bg-gray-300 h-3 rounded mb-1"></div>
                                    <div class="bg-gray-300 h-3 rounded"></div>
                                </div>
                            </div>
                        </div>
                        <h3 class="text-base md:text-lg font-bold text-black text-center mb-1">Proposal</h3>
                        <p class="text-xs text-gray-500 text-center">Document</p>
                    </a>
                </div>
            </section>
            
            <!-- Features -->
            <section class="mb-8 md:mb-12 px-4">
                <h2 class="text-xl md:text-2xl font-bold text-black mb-4 md:mb-6 text-center" v-text="t('package-features')"></h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                    <div class="bg-white border border-gray-300 rounded p-4 md:p-6 text-center">
                        <i class="fas fa-mobile-alt text-3xl md:text-4xl text-black mb-3 md:mb-4"></i>
                        <h3 class="font-bold text-black mb-2 text-sm md:text-base" v-text="t('fully-responsive')"></h3>
                        <p class="text-xs md:text-sm text-gray-700" v-text="t('fully-responsive-desc')"></p>
                    </div>
                    <div class="bg-white border border-gray-300 rounded p-4 md:p-6 text-center">
                        <i class="fas fa-calendar-check text-3xl md:text-4xl text-black mb-3 md:mb-4"></i>
                        <h3 class="font-bold text-black mb-2 text-sm md:text-base" v-text="t('booking-system')"></h3>
                        <p class="text-xs md:text-sm text-gray-700" v-text="t('booking-system-desc')"></p>
                    </div>
                    <div class="bg-white border border-gray-300 rounded p-4 md:p-6 text-center">
                        <i class="fas fa-palette text-3xl md:text-4xl text-black mb-3 md:mb-4"></i>
                        <h3 class="font-bold text-black mb-2 text-sm md:text-base" v-text="t('multiple-themes')"></h3>
                        <p class="text-xs md:text-sm text-gray-700" v-text="t('multiple-themes-desc')"></p>
                    </div>
                </div>
            </section>
            
            <!-- Contact -->
            <section class="mb-8 md:mb-12 px-4">
                <div class="bg-black text-white rounded p-4 md:p-6 text-center">
                    <h2 class="text-lg md:text-xl font-bold mb-3 md:mb-4" v-text="t('need-help')"></h2>
                    <p class="text-sm md:text-base text-gray-300 mb-4" v-text="t('contact-desc')"></p>
                    <div class="flex flex-col sm:flex-row justify-center items-center gap-4 sm:gap-6 text-sm">
                        <div>
                            <i class="fas fa-envelope text-2xl mb-2"></i>
                            <p class="text-gray-300 text-xs sm:text-sm break-all">info@rancangrinakit.com</p>
                        </div>
                        <div>
                            <i class="fas fa-phone text-2xl mb-2"></i>
                            <p class="text-gray-300 text-xs sm:text-sm">+62 817-2888-30</p>
                        </div>
                        <div>
                            <i class="fas fa-globe text-2xl mb-2"></i>
                            <p class="text-gray-300 text-xs sm:text-sm">rancangrinakit.com</p>
                        </div>
                    </div>
                </div>
            </section>
            
        </main>
        
        <!-- Footer -->
        <footer class="bg-white border-t border-gray-300 py-4 mt-8">
            <div class="container mx-auto px-4 text-center">
                <p class="text-xs text-gray-600" v-text="t('footer-text')"></p>
            </div>
        </footer>
        
        <!-- Language Toggle Button -->
        <button 
            @click="toggleLanguage" 
            class="fixed top-4 right-4 z-50 bg-black text-white px-3 py-2 rounded-lg shadow-lg hover:bg-gray-800 transition-all duration-200 flex items-center gap-2 text-sm font-medium"
            style="min-width: 60px;">
            <i class="fas fa-globe text-xs"></i>
            <span>{{ currentLang === 'id' ? 'ID' : 'EN' }}</span>
        </button>
    </div>
    
    <script src="js/language-toggle.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
